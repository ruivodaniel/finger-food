<figure style="margin:0">
<svg viewBox="0 0 980 752" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Inter,system-ui,sans-serif" role="img" aria-label="Activity diagram: the Platform Owner grants credits">
  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6f80"/></marker>
    <marker id="ad-arrow-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635bff"/></marker>
  </defs>
  <style>
    .ad-lane  { fill:#faf8f3; stroke:#e6dfd2; stroke-width:1; }
    .ad-lane2 { fill:#fffdf8; stroke:#e6dfd2; stroke-width:1; }
    .ad-sep   { stroke:#e6dfd2; stroke-width:1; }
    .ad-head  { font-size:11.5px; fill:#8c8478; letter-spacing:.08em; text-anchor:middle; }
    .ad-act   { fill:#ffffff; stroke:#8c8478; stroke-width:1.1; }
    .ad-stripe{ fill:#f1f0ff; stroke:#635bff; stroke-width:1.1; }
    .ad-dec   { fill:#f3ead6; stroke:#a9752a; stroke-width:1.1; }
    .ad-stop  { fill:#fbecea; stroke:#c0504d; stroke-width:1.1; }
    .ad-t     { font-size:13px; fill:#1b1813; text-anchor:middle; }
    .ad-m     { font-size:11.5px; fill:#8c8478; text-anchor:middle; }
    .ad-flow  { fill:none; stroke:#5c6f80; stroke-width:1.4; marker-end:url(#ad-arrow); }
    .ad-ev    { stroke:#635bff; stroke-dasharray:5 4; marker-end:url(#ad-arrow-ev); }
    .ad-lbl   { font-size:11px; fill:#5c6f80; font-style:italic; }
    .ad-note  { font-size:12px; fill:#5c6f80; }
    .ad-dot   { fill:#1b1813; }
    .ad-ring  { fill:none; stroke:#1b1813; stroke-width:1.5; }
  </style>

  <rect x="10" y="10" width="320" height="698" class="ad-lane"/>
  <rect x="330" y="10" width="320" height="698" class="ad-lane2"/>
  <rect x="650" y="10" width="320" height="698" class="ad-lane"/>
  <text x="170" y="34" class="ad-head">PLATFORM OWNER</text>
  <text x="490" y="34" class="ad-head">CREDITS SLICE</text>
  <text x="810" y="34" class="ad-head">RECIPIENT</text>
  <line x1="10" y1="50" x2="970" y2="50" class="ad-sep"/>

  <circle cx="170" cy="92" r="9" class="ad-dot"/>
  <path d="M170 101 V142" class="ad-flow"/>

  <rect x="45" y="142" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="160" class="ad-t">Open Credit grants</text>
  <text x="170" y="177" class="ad-m">at /manage-credits</text>
  <path d="M170 186 V214" class="ad-flow"/>

  <rect x="45" y="214" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="232" class="ad-t">Choose the recipient</text>
  <text x="170" y="249" class="ad-m">an organization or a person</text>
  <path d="M170 258 V286" class="ad-flow"/>

  <rect x="45" y="286" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="304" class="ad-t">Amount, services, expiry</text>
  <text x="170" y="321" class="ad-m">priority (a gift by default), note</text>
  <path d="M170 330 V344 H490 V358" class="ad-flow"/>

  <polygon points="365,380 490,358 615,380 490,402" class="ad-dec"/>
  <text x="490" y="384" class="ad-t">grant_credits_platform?</text>
  <path d="M365 380 H295" class="ad-flow"/>
  <text x="322" y="373" class="ad-lbl">no</text>

  <rect x="45" y="358" width="250" height="44" rx="10" class="ad-stop"/>
  <text x="170" y="385" class="ad-t">Refused: 403</text>
  <path d="M170 402 V441" class="ad-flow"/>
  <circle cx="170" cy="452" r="11" class="ad-ring"/><circle cx="170" cy="452" r="6" class="ad-dot"/>

  <path d="M490 402 V430" class="ad-flow"/>
  <text x="498" y="421" class="ad-lbl">yes</text>
  <rect x="365" y="430" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="448" class="ad-t">One admin_grant lot</text>
  <text x="490" y="465" class="ad-m">and a grant row in the ledger</text>
  <path d="M490 474 V488 H810 V502" class="ad-flow"/>

  <rect x="685" y="502" width="250" height="44" rx="10" class="ad-act"/>
  <text x="810" y="529" class="ad-t">Sees it in the balance</text>
  <path d="M810 546 V574" class="ad-flow"/>

  <rect x="685" y="574" width="250" height="44" rx="10" class="ad-act"/>
  <text x="810" y="592" class="ad-t">Spends it</text>
  <text x="810" y="609" class="ad-m">only on the chosen services</text>
  <path d="M810 618 V657" class="ad-flow"/>
  <circle cx="810" cy="668" r="11" class="ad-ring"/><circle cx="810" cy="668" r="6" class="ad-dot"/>

  <text x="10" y="734" class="ad-note">Only the Platform Owner holds grant_credits_platform. No payment is involved; the lot is a gift unless another priority is chosen.</text>
</svg>
</figure>
