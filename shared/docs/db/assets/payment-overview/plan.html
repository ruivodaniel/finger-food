<figure style="margin:0">
<svg viewBox="0 0 980 860" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Inter,system-ui,sans-serif" role="img" aria-label="Activity diagram: a plan's lifecycle, from subscribing to renewing, switching and cancelling">
  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6f80"/></marker>
    <marker id="ad-arrow-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635bff"/></marker>
  </defs>
  <style>
    .ad-lane  { fill:#faf8f3; stroke:#e6dfd2; stroke-width:1; }
    .ad-lane2 { fill:#fffdf8; stroke:#e6dfd2; stroke-width:1; }
    .ad-sep   { stroke:#e6dfd2; stroke-width:1; }
    .ad-head  { font-size:11.5px; fill:#8c8478; letter-spacing:.08em; text-anchor:middle; }
    .ad-act   { fill:#ffffff; stroke:#8c8478; stroke-width:1.1; }
    .ad-stripe{ fill:#f1f0ff; stroke:#635bff; stroke-width:1.1; }
    .ad-dec   { fill:#f3ead6; stroke:#a9752a; stroke-width:1.1; }
    .ad-stop  { fill:#fbecea; stroke:#c0504d; stroke-width:1.1; }
    .ad-t     { font-size:13px; fill:#1b1813; text-anchor:middle; }
    .ad-m     { font-size:11.5px; fill:#8c8478; text-anchor:middle; }
    .ad-flow  { fill:none; stroke:#5c6f80; stroke-width:1.4; marker-end:url(#ad-arrow); }
    .ad-ev    { stroke:#635bff; stroke-dasharray:5 4; marker-end:url(#ad-arrow-ev); }
    .ad-lbl   { font-size:11px; fill:#5c6f80; font-style:italic; }
    .ad-note  { font-size:12px; fill:#5c6f80; }
    .ad-dot   { fill:#1b1813; }
    .ad-ring  { fill:none; stroke:#1b1813; stroke-width:1.5; }
  </style>

  <rect x="10" y="10" width="320" height="770" class="ad-lane"/>
  <rect x="330" y="10" width="320" height="770" class="ad-lane2"/>
  <rect x="650" y="10" width="320" height="770" class="ad-lane"/>
  <text x="170" y="34" class="ad-head">OWNER</text>
  <text x="490" y="34" class="ad-head">APP</text>
  <text x="810" y="34" class="ad-head">STRIPE</text>
  <line x1="10" y1="50" x2="970" y2="50" class="ad-sep"/>

  <circle cx="170" cy="92" r="9" class="ad-dot"/>
  <path d="M170 101 V142" class="ad-flow"/>

  <rect x="45" y="142" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="160" class="ad-t">Choose a plan</text>
  <text x="170" y="177" class="ad-m">Starter or Pro, on Billing</text>
  <path d="M170 186 V200 H490 V214" class="ad-flow"/>

  <rect x="365" y="214" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="241" class="ad-t">Checkout in subscription mode</text>
  <path d="M490 258 V272 H810 V286" class="ad-flow"/>

  <rect x="685" y="286" width="250" height="44" rx="10" class="ad-stripe"/>
  <text x="810" y="304" class="ad-t">Hosted Checkout</text>
  <text x="810" y="321" class="ad-m">invoice.paid, subscription events</text>
  <path d="M810 330 V344 H490 V358" class="ad-flow ad-ev"/>

  <rect x="365" y="358" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="376" class="ad-t">Sync from the subscription</text>
  <text x="490" y="393" class="ad-m">read from Stripe, not the event</text>
  <path d="M490 402 V430" class="ad-flow"/>

  <polygon points="365,452 490,430 615,452 490,474" class="ad-dec"/>
  <text x="490" y="456" class="ad-t">New paid period or plan?</text>
  <path d="M615 452 H685" class="ad-flow"/>
  <text x="642" y="445" class="ad-lbl">no</text>

  <rect x="685" y="430" width="250" height="44" rx="10" class="ad-act"/>
  <text x="810" y="448" class="ad-t">Nothing to do</text>
  <text x="810" y="465" class="ad-m">the second event of the pair</text>
  <path d="M810 474 V513" class="ad-flow"/>
  <circle cx="810" cy="524" r="11" class="ad-ring"/><circle cx="810" cy="524" r="6" class="ad-dot"/>

  <path d="M490 474 V502" class="ad-flow"/>
  <text x="498" y="493" class="ad-lbl">yes</text>
  <rect x="365" y="502" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="520" class="ad-t">Grant the plan's credits</text>
  <text x="490" y="537" class="ad-m">a lot to the period end, and prices</text>
  <path d="M490 546 V560 H170 V574" class="ad-flow"/>

  <rect x="45" y="574" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="601" class="ad-t">Uses the plan's credits</text>
  <path d="M170 618 V646" class="ad-flow"/>

  <rect x="45" y="646" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="664" class="ad-t">Renew, switch or cancel</text>
  <text x="170" y="681" class="ad-m">switch and cancel in the portal</text>
  <path d="M170 690 V704 H810 V718" class="ad-flow"/>

  <rect x="685" y="718" width="250" height="44" rx="10" class="ad-stripe"/>
  <text x="810" y="736" class="ad-t">Renewal or change events</text>
  <text x="810" y="753" class="ad-m">invoice.paid &#183; subscription.updated</text>
  <path d="M935 740 H955 V380 H615" class="ad-flow ad-ev"/>

  <text x="10" y="806" class="ad-note">Dashed: a webhook. Switching plan ends the current plan lot now, grants the new amount and moves the owner's prices.</text>
  <text x="10" y="824" class="ad-note">Cancelling ends the lot and puts the owner back on the free prices. A past-due period's lot arrives when its invoice is paid.</text>
</svg>
</figure>
