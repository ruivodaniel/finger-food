<figure style="margin:0">
<svg viewBox="0 0 980 842" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Inter,system-ui,sans-serif" role="img" aria-label="Activity diagram: a marketplace sale paid by card on the vendor's Stripe account">
  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6f80"/></marker>
    <marker id="ad-arrow-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635bff"/></marker>
  </defs>
  <style>
    .ad-lane  { fill:#faf8f3; stroke:#e6dfd2; stroke-width:1; }
    .ad-lane2 { fill:#fffdf8; stroke:#e6dfd2; stroke-width:1; }
    .ad-sep   { stroke:#e6dfd2; stroke-width:1; }
    .ad-head  { font-size:11.5px; fill:#8c8478; letter-spacing:.08em; text-anchor:middle; }
    .ad-act   { fill:#ffffff; stroke:#8c8478; stroke-width:1.1; }
    .ad-stripe{ fill:#f1f0ff; stroke:#635bff; stroke-width:1.1; }
    .ad-dec   { fill:#f3ead6; stroke:#a9752a; stroke-width:1.1; }
    .ad-stop  { fill:#fbecea; stroke:#c0504d; stroke-width:1.1; }
    .ad-t     { font-size:13px; fill:#1b1813; text-anchor:middle; }
    .ad-m     { font-size:11.5px; fill:#8c8478; text-anchor:middle; }
    .ad-flow  { fill:none; stroke:#5c6f80; stroke-width:1.4; marker-end:url(#ad-arrow); }
    .ad-ev    { stroke:#635bff; stroke-dasharray:5 4; marker-end:url(#ad-arrow-ev); }
    .ad-lbl   { font-size:11px; fill:#5c6f80; font-style:italic; }
    .ad-note  { font-size:12px; fill:#5c6f80; }
    .ad-dot   { fill:#1b1813; }
    .ad-ring  { fill:none; stroke:#1b1813; stroke-width:1.5; }
  </style>

  <rect x="10" y="10" width="320" height="770" class="ad-lane"/>
  <rect x="330" y="10" width="320" height="770" class="ad-lane2"/>
  <rect x="650" y="10" width="320" height="770" class="ad-lane"/>
  <text x="170" y="34" class="ad-head">BUYER</text>
  <text x="490" y="34" class="ad-head">APP</text>
  <text x="810" y="34" class="ad-head">STRIPE (THE VENDOR'S ACCOUNT)</text>
  <line x1="10" y1="50" x2="970" y2="50" class="ad-sep"/>

  <circle cx="170" cy="92" r="9" class="ad-dot"/>
  <path d="M170 101 V142" class="ad-flow"/>

  <rect x="45" y="142" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="160" class="ad-t">Pay by card</text>
  <text x="170" y="177" class="ad-m">on the product page</text>
  <path d="M170 186 V200 H490 V214" class="ad-flow"/>

  <polygon points="365,236 490,214 615,236 490,258" class="ad-dec"/>
  <text x="490" y="240" class="ad-t">Can this be bought?</text>
  <path d="M365 236 H295" class="ad-flow"/>
  <text x="322" y="229" class="ad-lbl">no</text>

  <rect x="45" y="214" width="250" height="44" rx="10" class="ad-stop"/>
  <text x="170" y="232" class="ad-t">Refused, with the reason</text>
  <text x="170" y="249" class="ad-m">withdrawn, unpayable or your own</text>
  <path d="M170 258 V297" class="ad-flow"/>
  <circle cx="170" cy="308" r="11" class="ad-ring"/><circle cx="170" cy="308" r="6" class="ad-dot"/>

  <path d="M490 258 V286" class="ad-flow"/>
  <text x="498" y="277" class="ad-lbl">yes</text>
  <rect x="365" y="286" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="304" class="ad-t">Checkout on the vendor's account</text>
  <text x="490" y="321" class="ad-m">the product's price + 10% fee</text>
  <path d="M490 330 V344 H810 V358" class="ad-flow"/>

  <rect x="685" y="358" width="250" height="44" rx="10" class="ad-stripe"/>
  <text x="810" y="376" class="ad-t">Hosted Checkout</text>
  <text x="810" y="393" class="ad-m">a direct charge: the vendor's money</text>
  <path d="M810 402 V430" class="ad-flow"/>

  <rect x="685" y="430" width="250" height="44" rx="10" class="ad-stripe"/>
  <text x="810" y="448" class="ad-t">checkout.session.completed</text>
  <text x="810" y="465" class="ad-m">on the Connect endpoint</text>
  <path d="M810 474 V488 H490 V502" class="ad-flow ad-ev"/>

  <polygon points="365,524 490,502 615,524 490,546" class="ad-dec"/>
  <text x="490" y="528" class="ad-t">The product's vendor?</text>
  <path d="M615 524 H685" class="ad-flow"/>
  <text x="642" y="517" class="ad-lbl">no</text>

  <rect x="685" y="502" width="250" height="44" rx="10" class="ad-act"/>
  <text x="810" y="529" class="ad-t">Nothing recorded</text>
  <path d="M810 546 V585" class="ad-flow"/>
  <circle cx="810" cy="596" r="11" class="ad-ring"/><circle cx="810" cy="596" r="6" class="ad-dot"/>

  <path d="M490 546 V574" class="ad-flow"/>
  <text x="498" y="565" class="ad-lbl">yes</text>
  <rect x="365" y="574" width="250" height="44" rx="10" class="ad-act"/>
  <text x="490" y="592" class="ad-t">Purchase born paid, once</text>
  <text x="490" y="609" class="ad-m">and the buyer's payment row</text>
  <path d="M490 618 V632 H170 V646" class="ad-flow"/>

  <rect x="45" y="646" width="250" height="44" rx="10" class="ad-act"/>
  <text x="170" y="673" class="ad-t">Sees it in Purchases</text>
  <path d="M170 690 V729" class="ad-flow"/>
  <circle cx="170" cy="740" r="11" class="ad-ring"/><circle cx="170" cy="740" r="6" class="ad-dot"/>

  <text x="10" y="806" class="ad-note">Dashed: a webhook. The vendor sees the sale on Selling; money refunds, payouts and disputes are in the Express dashboard.</text>
</svg>
</figure>
