linkWorkspacePackages: true
packages:
  - "apps/main/core/api"
  - "apps/main/core/web"
  - "apps/main/core/mobile"
  - "apps/main/slices/shared"
  - "apps/main/slices/seed/*"
  - "apps/main/slices/product/*"
  - "shared/configs/*"
  - "shared/configs/libs/*"
  - "shared/libs/*"
  - "shared/libs/orchestrator/*"
  - "shared/libs/ui/web"
  - "shared/libs/ui/web/primitives/layouts"
  - "shared/libs/ui/web/fixtures"
  - "shared/libs/ui/mobile/*"

# ONE version of every Radix package for the whole repo (24 Oct 2026): a sheet and a select inside it share one dismissable layer only if they share one copy.
# Every package.json says "catalog:"; the overrides in the root package.json make third parties (cmdk…) take the same.
catalog:
  # ONE pglite for the whole repo (28 Oct 2026): drizzle-orm is built once per pglite version it is paired with,
  # and two drizzle copies make the main API's db and the slices' repositories two incompatible types.
  "@electric-sql/pglite": "0.5.11"
  "@radix-ui/primitive": "1.1.3"
  "@radix-ui/react-accordion": "1.2.12"
  "@radix-ui/react-alert-dialog": "1.1.15"
  "@radix-ui/react-avatar": "1.1.10"
  "@radix-ui/react-checkbox": "1.3.2"
  "@radix-ui/react-collapsible": "1.1.12"
  "@radix-ui/react-context": "1.1.3"
  "@radix-ui/react-dialog": "1.1.15"
  "@radix-ui/react-dismissable-layer": "1.1.11"
  "@radix-ui/react-dropdown-menu": "2.1.15"
  "@radix-ui/react-focus-guards": "1.1.3"
  "@radix-ui/react-hover-card": "1.1.15"
  "@radix-ui/react-label": "2.1.7"
  "@radix-ui/react-popover": "1.1.15"
  "@radix-ui/react-popper": "1.2.8"
  "@radix-ui/react-presence": "1.1.5"
  "@radix-ui/react-primitive": "2.1.4"
  "@radix-ui/react-progress": "1.1.8"
  "@radix-ui/react-radio-group": "1.3.8"
  "@radix-ui/react-roving-focus": "1.1.11"
  "@radix-ui/react-scroll-area": "1.2.9"
  "@radix-ui/react-select": "2.2.6"
  "@radix-ui/react-separator": "1.1.7"
  "@radix-ui/react-slot": "1.2.4"
  "@radix-ui/react-switch": "1.2.5"
  "@radix-ui/react-tabs": "1.1.12"
  "@radix-ui/react-toggle": "1.1.10"
  "@radix-ui/react-toggle-group": "1.1.11"
  "@radix-ui/react-tooltip": "1.2.7"
